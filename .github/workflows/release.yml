name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release with Overlay Tarball
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build overlay tarball
        run: |
          tar czf justplugins-overlay.tar.gz \
            src/plugin-info.c src/plugin-info.h \
            src/plugin-manager.c src/plugin-manager.h \
            src/plugin-manager-page.c src/plugin-manager-page.h \
            src/ui/plugin-manager-page.ui

      - name: Copy APKBUILD and patches
        run: |
          cp -r alpine/ release-assets/
          cp justplugins-overlay.tar.gz release-assets/

      - name: Generate sha512sums
        run: |
          cd release-assets
          sha512sum justplugins-overlay.tar.gz patches/*.patch > sha512sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/justplugins-overlay.tar.gz
            release-assets/APKBUILD
            release-assets/patches/*.patch
            release-assets/sha512sums.txt
