# Release workflow - creates a GitHub release with the overlay tarball
# Triggered when a tag matching v* is pushed

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout JustPlugins
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate overlay tarball
        run: |
          bash scripts/make-overlay.sh "${{ steps.version.outputs.VERSION }}"

      - name: Compute checksums
        run: |
          cd dist
          sha512sum justplugins-overlay-*.tar.gz > sha512sums.txt
          cat sha512sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JustPlugins ${{ steps.version.outputs.VERSION }}
          body: |
            ## JustPlugins ${{ steps.version.outputs.VERSION }}

            ### Overlay tarball
            Download the overlay tarball and use it with the APKBUILD
            from the `apkbuild/` directory.

            ### Installation on postmarketOS
            ```bash
            # Clone the repo
            git clone https://github.com/cynosure279/JustPlugins.git
            cd JustPlugins/apkbuild

            # Build the package
            abuild -r

            # Install
            sudo apk add --allow-untrusted ../$(uname -m)/phosh-justplugins-*.apk
            ```
          files: |
            dist/justplugins-overlay-*.tar.gz
            dist/sha512sums.txt
            apkbuild/APKBUILD
          draft: false
          prerelease: false
