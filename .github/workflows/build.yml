# JustPlugins CI/CD - Build Phosh with Plugin Manager
#
# Uses a Debian Trixie container because Phosh main requires GNOME 47+
# packages not available in Ubuntu 24.04 (which ships GNOME 46).

name: Build & Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      phosh_ref:
        description: 'Phosh git ref to build against'
        required: false
        default: 'main'
        type: string

env:
  PHOSH_REPO: https://gitlab.gnome.org/World/Phosh/phosh.git
  PHOSH_REF: ${{ inputs.phosh_ref || 'main' }}
  BUILD_DIR: _build
  BUILD_OPTS: -Dtools=true -Dtests=false -Dgtk_doc=false -Dintrospection=false -Dman=false

jobs:
  build:
    name: Build (Debian Trixie)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie

    steps:
      - name: Install basic tools
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates

      - name: Checkout JustPlugins
        uses: actions/checkout@v4
        with:
          path: justplugins

      - name: Install build dependencies
        run: |
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          else
            echo 'deb-src http://deb.debian.org/debian trixie main' >> /etc/apt/sources.list
            echo 'deb-src http://deb.debian.org/debian trixie-updates main' >> /etc/apt/sources.list
          fi
          apt-get update -qq
          apt-get build-dep -y phosh
          # Phosh main needs extra packages not in the Trixie package version
          apt-get install -y -qq cmake libqrcodegen-dev libgmobile-dev
          pip3 install --upgrade meson --break-system-packages || true
          meson --version

      - name: Checkout Phosh source
        run: |
          git clone --depth 1 --branch "$PHOSH_REF" "$PHOSH_REPO" phosh

      - name: Apply JustPlugins modifications
        run: |
          echo '=== Applying JustPlugins modifications to Phosh ==='
          cp -v justplugins/src/*.c justplugins/src/*.h phosh/src/ 2>/dev/null || true
          cp -v justplugins/src/ui/*.ui phosh/src/ui/ 2>/dev/null || true
          cp -v justplugins/src/meson.build phosh/src/meson.build
          cp -v justplugins/src/phosh.gresources.xml phosh/src/phosh.gresources.xml
          echo '--- Modified files ---'
          git -C phosh diff --stat || true
          echo '--- New files ---'
          git -C phosh ls-files --others --exclude-standard || true

      - name: Setup Meson
        run: |
          cd phosh
          meson setup ${{ env.BUILD_OPTS }} ${{ env.BUILD_DIR }}

      - name: Build Phosh
        run: |
          cd phosh
          meson compile -C ${{ env.BUILD_DIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phosh-justplugins-trixie
          path: |
            phosh/${{ env.BUILD_DIR }}/src/libphosh*
            phosh/${{ env.BUILD_DIR }}/src/phosh
            phosh/${{ env.BUILD_DIR }}/plugins/**/*.so
          retention-days: 7

  # Build on Alpine Linux (postmarketOS base)
  build-alpine:
    name: Build (Alpine Edge)
    runs-on: ubuntu-24.04
    container:
      image: alpine:edge

    steps:
      - name: Install build tools
        run: |
          apk add --no-cache git meson ninja cmake pkgconf python3 py3-pip build-base gcc musl-dev

      - name: Checkout JustPlugins
        uses: actions/checkout@v4
        with:
          path: justplugins

      - name: Install phosh build dependencies
        run: |
          # Enable community repo (phosh is in community)
          echo "https://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
          apk update
          apk add --no-cache \
            callaudiod-dev elogind-dev evince-dev evolution-data-server-dev \
            feedbackd-dev gcr-dev gettext-dev glib-dev gmobile-dev \
            gnome-bluetooth-dev gnome-desktop-dev gtk+3.0-dev libadwaita-dev \
            libgudev-dev libhandy1-dev libsecret-dev linux-pam-dev \
            modemmanager-dev networkmanager-dev polkit-elogind-dev \
            pulseaudio-dev py3-docutils qrcodegen-dev upower-dev \
            wayland-dev wayland-protocols

      - name: Checkout Phosh source
        run: |
          git clone --depth 1 --branch "$PHOSH_REF" "$PHOSH_REPO" phosh

      - name: Apply JustPlugins modifications
        run: |
          cp -v justplugins/src/*.c justplugins/src/*.h phosh/src/
          cp -v justplugins/src/ui/*.ui phosh/src/ui/ 2>/dev/null || true
          cp -v justplugins/src/meson.build phosh/src/meson.build
          cp -v justplugins/src/phosh.gresources.xml phosh/src/phosh.gresources.xml

      - name: Setup Meson
        run: |
          cd phosh
          meson setup ${{ env.BUILD_OPTS }} ${{ env.BUILD_DIR }}

      - name: Build Phosh
        run: |
          cd phosh
          meson compile -C ${{ env.BUILD_DIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phosh-justplugins-alpine
          path: |
            phosh/${{ env.BUILD_DIR }}/src/libphosh*
            phosh/${{ env.BUILD_DIR }}/src/phosh
            phosh/${{ env.BUILD_DIR }}/plugins/**/*.so
          retention-days: 7

  lint:
    name: Code Style Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout JustPlugins
        uses: actions/checkout@v4
        with:
          path: justplugins

      - name: Check C source files
        run: |
          echo '=== Checking C source files ==='
          find justplugins -name '*.c' -o -name '*.h' | while read f; do
            echo "Checking: $f"
            if ! grep -q 'Copyright' "$f" 2>/dev/null; then
              echo "WARNING: $f missing copyright header"
            fi
            if ! grep -q 'SPDX-License-Identifier' "$f" 2>/dev/null; then
              echo "WARNING: $f missing SPDX license identifier"
            fi
            if grep -Pn '^ +' "$f" | head -3 | grep -q .; then
              echo "WARNING: $f may use spaces instead of tabs for indentation"
            fi
          done

  validate:
    name: Structure Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo '=== Project Structure ==='
          find . -type f -not -path './.git/*' | sort
          echo ''
          echo '=== Plan check ==='
          if [ -f plan.md ]; then
            echo 'plan.md exists'
            wc -l plan.md
          else
            echo 'plan.md missing'
            exit 1
          fi
          echo ''
          echo '=== GitHub Actions check ==='
          if [ -f .github/workflows/build.yml ]; then
            echo 'Workflow exists'
          fi
